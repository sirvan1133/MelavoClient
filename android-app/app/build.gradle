plugins { id 'com.android.application' }
android {
 namespace 'org.melavo.vpn'
 compileSdk 36
 defaultConfig { applicationId 'org.melavo.vpn'; minSdk 24; targetSdk 36; versionCode 902; versionName '0.9.2'; testInstrumentationRunner 'org.melavo.vpn.SmokeRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { if(System.getenv('MELAVO_KEYSTORE')) { storeFile file(System.getenv('MELAVO_KEYSTORE')); storePassword System.getenv('MELAVO_SIGNING_PASSWORD'); keyAlias 'melavo'; keyPassword System.getenv('MELAVO_SIGNING_PASSWORD') } } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 splits { abi { enable true; reset(); include 'armeabi-v7a','arm64-v8a','x86','x86_64'; universalApk true } }
 packaging { jniLibs { useLegacyPackaging false } }
}
dependencies { implementation files('libs/libv2ray.aar'); implementation 'com.google.zxing:core:3.5.3' }
tasks.register('verifyCore') { doLast { def digest=java.security.MessageDigest.getInstance('SHA-256').digest(file('libs/libv2ray.aar').bytes).encodeHex().toString(); if(digest!='cf71680b776b9ca583747ba652f816b047a655eab875d8951e6141636d88bbd6') throw new GradleException('Core integrity check failed') } }
tasks.named('preBuild').configure { dependsOn 'verifyCore' }
